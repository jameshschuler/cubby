name: Quality Checks

on:
  push:
    branches:
      - main
    paths:
      - "cubby/**"
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
    paths:
      - "cubby/**"
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cubby

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cubby/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run typecheck
        run: npx tsc --noEmit

      - name: Run lint
        run: npm run lint

      - name: Run formatting check
        run: npm run format:check
